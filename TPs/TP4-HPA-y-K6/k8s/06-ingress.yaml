apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrasense-ingress
  namespace: terrasense
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.terrasense.local
      http:
        paths:
          - path: /
    pathType: Prefix
      backend:
              service:
                name: back
                port:
                  number: 8080
    - host: terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 8080