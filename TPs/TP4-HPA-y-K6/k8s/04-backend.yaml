apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: terrasense
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: back
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: terrasense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
        - name: back
          image: terrasense-back:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: terrasense-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: terrasense-config
                  key: DB_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: terrasense-config
                  key: CORS_ALLOWED_ORIGINS
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: terrasense-config
                  key: JAVA_TOOL_OPTIONS
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: terrasense-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrasense-secret
                  key: POSTGRES_PASSWORD
            - name: API_KEY_INSERT
              valueFrom:
                secretKeyRef:
                  name: terrasense-secret
                  key: API_KEY_INSERT
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
