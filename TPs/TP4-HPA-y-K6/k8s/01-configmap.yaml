apiVersion: v1
kind: ConfigMap
metadata:
  name: terrasense-config
  namespace: terrasense
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  POSTGRES_DB: "iot_db"
  DB_URL: "jdbc:postgresql://db:5432/iot_db"
  CORS_ALLOWED_ORIGINS: "http://terrasense.local,http://localhost:5173"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"